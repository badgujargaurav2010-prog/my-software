<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B. S. Venture - Billing</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f2f2f2;color:#111}
.w{max-width:900px;margin:auto;padding:12px}
h2{margin:8px 0}input,select,textarea,button{font:inherit;padding:8px;border:1px solid #999;border-radius:6px}
input,select,textarea{width:100%}button{background:#1a3d7c;color:#fff;border:0;cursor:pointer;margin:2px}
button.g{background:#666}button.r{background:#b00020}
.card{background:#fff;padding:12px;border-radius:8px;margin:10px 0}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.nav{display:flex;flex-wrap:wrap}table.l{width:100%;border-collapse:collapse}
table.l td,table.l th{border-bottom:1px solid #ddd;padding:6px;text-align:left}
.item{display:grid;grid-template-columns:2fr 1fr .7fr 1fr 1fr;gap:4px;margin:4px 0}
#sheet{position:absolute;left:-9999px;top:0;width:794px;background:#fff}
body{background:linear-gradient(160deg,#eaf0fb,#faf5e8);min-height:100vh;font-family:'Segoe UI',system-ui,sans-serif}
.hd{background:linear-gradient(135deg,#0f2a5c,#1f4a96);color:#fff;padding:18px 20px;border-radius:14px;margin:8px 0 12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 6px 18px rgba(15,42,92,.25)}
.hd span{font-weight:900;font-size:24px;letter-spacing:2px}.hd small{color:#f5c542;font-weight:600;letter-spacing:1.5px}
.card{border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.07);border:1px solid #e3e8f4}
input,select,textarea{border:1.5px solid #d3d9e8;background:#fbfcff}
input:focus,select:focus,textarea:focus{outline:none;border-color:#1a3d7c;box-shadow:0 0 0 3px rgba(26,61,124,.15)}
button{background:linear-gradient(135deg,#1a3d7c,#2c5bb5);border-radius:999px;padding:9px 18px;font-weight:600;box-shadow:0 2px 6px rgba(26,61,124,.25);transition:.15s}
button:hover{transform:translateY(-1px)}
button.g{background:#fff;color:#1a3d7c;border:1.5px solid #c5d0ea;box-shadow:none}
button.r{background:linear-gradient(135deg,#b00020,#d6334d)}
.nav{gap:4px;margin-bottom:6px}
table.l th{background:#eef3fc;color:#0f2a5c;font-size:13px}table.l tr:nth-child(even) td{background:#fafbff}
.item{background:#f4f7fd;padding:6px;border-radius:10px}
#gt{background:#0f2a5c;color:#f5c542;padding:12px 18px;border-radius:12px;display:inline-block}
@media print{body>*:not(#sheet){display:none!important}#sheet{position:static;left:0}}
</style></head><body>
<div id="sheet"></div>
<div class="w" id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEF_HASH='4119a8dc2e5a67cb241e25bce2ce9f53d9c2c10899d923e5498d5b6e45581eb3',USER='bsventure';
const db=new Promise(r=>{const q=indexedDB.open('bsv',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result)});
const kv=(m,k,v)=>db.then(d=>new Promise((res,rej)=>{const s=d.transaction('kv',m==='get'?'readonly':'readwrite').objectStore('kv');const q=m==='get'?s.get(k):s.put(v,k);q.onsuccess=()=>res(q.result);q.onerror=rej}));
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const f2=n=>(+n||0).toFixed(2);
function words(n){n=Math.round(n);if(!n)return'Zero';const a='One Two Three Four Five Six Seven Eight Nine Ten Eleven Twelve Thirteen Fourteen Fifteen Sixteen Seventeen Eighteen Nineteen'.split(' '),t='_ _ Twenty Thirty Forty Fifty Sixty Seventy Eighty Ninety'.split(' ');
const two=x=>x<20?a[x-1]||'':t[Math.floor(x/10)]+(x%10?' '+a[x%10-1]:'');
const th=(x,w)=>x?two(x)+' '+w+' ':'';let s='';s+=th(Math.floor(n/1e7),'Crore');s+=th(Math.floor(n/1e5)%100,'Lakh');s+=th(Math.floor(n/1e3)%100,'Thousand');
const h=Math.floor(n/100)%10;if(h)s+=a[h-1]+' Hundred ';const r=n%100;if(r)s+=two(r);return s.trim()}
function calc(b){const sub=b.items.reduce((s,i)=>s+(+i.qty||0)*(+i.rate||0),0),sg=sub*b.sgst/100,cg=sub*b.cgst/100,ig=sub*b.igst/100;return{sub,sg,cg,ig,tot:sub+sg+cg+ig}}
const dm=d=>d?d.split('-').reverse().join('/'):'';
function inv(b){const c=calc(b),B='border:1.5px solid #000';let rows='';const n=Math.max(12,b.items.length);
for(let i=0;i<n;i++){const t=b.items[i];rows+=`<tr style="height:26px">${[t?i+1:'',t?esc(t.desc):'',t?esc(t.hsn):'',t?t.qty:'',t?f2(t.rate):'',t?f2(t.qty*t.rate):''].map((v,j)=>`<td style="border-left:1.5px solid #000;padding:2px 5px;${j>2?'text-align:right':''}">${v}</td>`).join('')}</tr>`}
const tr=(l,p,v)=>`<tr><td style="${B};padding:5px;font-weight:bold">${l}${p!==''?' '+p+' %':''}</td><td style="${B};padding:5px;text-align:right">${v}</td></tr>`;
return`<div style="width:794px;padding:16px;font:12px Arial;color:#000"><div style="${B};">
<div style="text-align:center;padding:6px"><span style="background:#222;color:#fff;padding:3px 18px;font-weight:bold;letter-spacing:2px">TAX INVOICE</span>
<div style="font:900 40px Arial;margin:4px 0">B. S. VENTURE</div>
<div style="font-size:11px"><b>Office :</b> Plot No. 493, South City, CIDCO Waluj, Mahanagar -2, Near Kailas Hotel, Chh. Sambhajinagar-431136<br><b>Factory :</b> Plot No. 626/1, Milkat No. -1189, Behind of Trimurti Hotel, Pune-Nashik Highway, Kuruli, Tal.-Khed, Dist.-Pune-410501<br><b>Email :</b> b.s.venture.18@gmail.com &nbsp; <b>Mob. :</b> 9225606441/ 9371925066</div>
<div style="font-weight:bold;font-size:14px;margin-top:4px">GSTIN : 27IMOPB9617L1ZB</div></div>
<div style="display:flex;border-top:1.5px solid #000"><div style="flex:1.3;padding:6px;border-right:1.5px solid #000;min-height:90px"><b>To,</b><br>${esc(b.to).replace(/\n/g,'<br>')}<br><br><b>Buyer GST No.:</b> ${esc(b.gst)}</div>
<div style="flex:1;padding:6px;line-height:26px"><b>Invoice No.:</b> <span style="color:#b00">${esc(b.no)}</span> &nbsp; <b>Date:</b> ${dm(b.date)}<br><b>P.O. No.:</b> ${esc(b.po)} &nbsp; <b>Date:</b> ${dm(b.podate)}<br><b>Vendor Co.:</b> ${esc(b.vendor)}</div></div>
<table style="width:100%;border-collapse:collapse;border-top:1.5px solid #000"><tr style="text-align:center;font-weight:bold">${['Sr. No.','Description','HSN/ SAC Code','Qty.','Rate Per Unit','Amount (Rs.)'].map(h=>`<td style="padding:5px;border-left:1.5px solid #000">${h}</td>`).join('')}</tr>${rows}</table>
<div style="display:flex;border-top:1.5px solid #000"><div style="flex:1.5;padding:6px"><b>Bank Details</b><br>Bank Ac No. : 925020018354184<br>Bank Name : Axis Bank<br>Bank IFSC : UTIB0005209<br><br><b>Rs. In Words :</b> ${words(c.tot)} Rupees Only</div>
<table style="flex:1;border-collapse:collapse;border-left:1.5px solid #000;align-self:stretch">${tr('TOTAL','',f2(c.sub))}${tr('SGST',b.sgst,f2(c.sg))}${tr('CGST',b.cgst,f2(c.cg))}${tr('IGST',b.igst,f2(c.ig))}${tr('GRAND TOTAL','',f2(c.tot))}</table></div>
<div style="display:flex;border-top:1.5px solid #000;height:110px"><div style="flex:1;border-right:1.5px solid #000;padding:6px;display:flex;align-items:flex-end;font-weight:bold">Receiver's Signature &amp; Stamp</div>
<div style="flex:1;padding:6px;text-align:right;display:flex;flex-direction:column;justify-content:space-between"><b style="font:900 20px Arial">B. S. VENTURE</b><span>Authorised Signatory</span></div></div></div></div>`}
const opt={margin:0,image:{type:'jpeg',quality:.95},html2canvas:{scale:2},jsPDF:{unit:'mm',format:'a4'}};
async function blob(html,name){$('#sheet').innerHTML=html;return html2pdf().set({...opt,filename:name}).from($('#sheet')).outputPdf('blob')}
let DLC=null;try{window.claude&&claude.use('downloads').then(x=>{DLC=x}).catch(()=>{})}catch(e){}
async function dl(bl,name){if(DLC){try{await DLC.save({filename:name,data:bl})}catch(e){if(e.code!=='declined')alert('Download is not available here')}return}
const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=name;a.click()}
async function share(html,name,text){const bl=await blob(html,name),f=new File([bl],name,{type:'application/pdf'});
if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name,text});return}catch(e){if(e.name==='AbortError')return}}
dl(bl,name);const t=encodeURIComponent(text);alert('PDF downloaded. Now attach it in the app you choose.');
const w=prompt('Open: type w = WhatsApp, t = Telegram, e = Email','w');
if(w==='w')open('https://wa.me/?text='+t);else if(w==='t')open('https://t.me/share/url?url=%20&text='+t);else if(w==='e')location.href='mailto:?subject='+encodeURIComponent(name)+'&body='+t}
let bills=[],purch=[],tab='new',draft=null;
const load=async()=>{bills=(await kv('get','bills'))||[];purch=(await kv('get','purch'))||[]};
const newDraft=async()=>{const seq=(await kv('get','seq'))||80;draft={no:String(seq),date:new Date().toISOString().slice(0,10),to:'',gst:'',po:'',podate:'',vendor:'',sgst:9,cgst:9,igst:0,items:[{desc:'',hsn:'',qty:1,rate:0}]}};
async function login(){const h=await sha($('#p').value),cur=(await kv('get','cred'))||DEF_HASH;
if($('#u').value.trim()===USER&&h===cur){sessionStorage.ok=1;await load();await newDraft();show()}else $('#e').textContent='Wrong username or password'}
function loginUI(){$('#app').innerHTML=`<div class="card" style="max-width:360px;margin:60px auto;text-align:center"><div class="hd" style="justify-content:center;flex-direction:column;gap:4px"><span>B. S. VENTURE</span><small>OWNER LOGIN</small></div><input id="u" placeholder="Username" autocomplete="username"><br><br><input id="p" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><br><br><button onclick="login()">Login</button><p id="e" style="color:#b00020"></p></div>`}
function show(){const T=[['new','New Bill'],['bills','Saved Bills'],['purch','Purchase Bills'],['bk','Backup / Settings']];
$('#app').innerHTML=`<div class="hd"><span>B. S. VENTURE</span><small>GST BILLING</small></div><div class="nav">${T.map(([k,l])=>`<button class="${tab===k?'':'g'}" onclick="tab='${k}';show()">${l}</button>`).join('')}<button class="r" onclick="sessionStorage.clear();loginUI()">Logout</button></div><div id="v"></div>`;({new:vNew,bills:vBills,purch:vPurch,bk:vBk})[tab]()}
function vNew(){const d=draft,c=calc(d);$('#v').innerHTML=`<div class="card"><div class="row"><div>Invoice No.<input value="${esc(d.no)}" oninput="draft.no=this.value"></div><div>Date<input type="date" value="${d.date}" oninput="draft.date=this.value"></div><div>P.O. No.<input value="${esc(d.po)}" oninput="draft.po=this.value"></div><div>P.O. Date<input type="date" value="${d.podate}" oninput="draft.podate=this.value"></div><div>Vendor Co.<input value="${esc(d.vendor)}" oninput="draft.vendor=this.value"></div></div><br>To (name &amp; address)<textarea rows="3" oninput="draft.to=this.value">${esc(d.to)}</textarea>Buyer GST No.<input value="${esc(d.gst)}" oninput="draft.gst=this.value"></div>
<div class="card"><b>Items</b> (Description / HSN / Qty / Rate / Amount)${d.items.map((t,i)=>`<div class="item"><input value="${esc(t.desc)}" oninput="draft.items[${i}].desc=this.value"><input value="${esc(t.hsn)}" oninput="draft.items[${i}].hsn=this.value"><input type="number" value="${t.qty}" oninput="draft.items[${i}].qty=this.value;tot()"><input type="number" value="${t.rate}" oninput="draft.items[${i}].rate=this.value;tot()"><input readonly value="${f2(t.qty*t.rate)}"></div>`).join('')}<button class="g" onclick="draft.items.push({desc:'',hsn:'',qty:1,rate:0});vNew()">+ Add item</button><button class="g" onclick="if(draft.items.length>1){draft.items.pop();vNew()}">- Remove last</button></div>
<div class="card"><div class="row"><div>SGST %<input type="number" value="${d.sgst}" oninput="draft.sgst=+this.value;tot()"></div><div>CGST %<input type="number" value="${d.cgst}" oninput="draft.cgst=+this.value;tot()"></div><div>IGST %<input type="number" value="${d.igst}" oninput="draft.igst=+this.value;tot()"></div></div><button class="g" onclick="draft.sgst=9;draft.cgst=9;draft.igst=0;vNew()">Same state: 9+9</button><button class="g" onclick="draft.sgst=0;draft.cgst=0;draft.igst=18;vNew()">Other state: IGST 18</button><h3 id="gt">Grand Total: Rs. ${f2(c.tot)}</h3>
<button onclick="saveBill()">Save Bill (PDF)</button></div>`}
const tot=()=>{$('#gt').textContent='Grand Total: Rs. '+f2(calc(draft).tot)};
async function saveBill(){if(!draft.to.trim())return alert('Enter customer in "To"');if(bills.some(b=>b.no===draft.no))return alert('Invoice number already used');
bills.unshift(JSON.parse(JSON.stringify(draft)));await kv('set','bills',bills);const n=parseInt(draft.no);await kv('set','seq',isNaN(n)?81:n+1);
await dl(await blob(inv(draft),`Invoice-${draft.no}.pdf`),`Invoice-${draft.no}.pdf`);await newDraft();tab='bills';show()}
function vBills(){$('#v').innerHTML=`<div class="card"><input placeholder="Search customer / invoice no." oninput="fl(this.value)"><table class="l" id="bt"></table></div>`;fl('')}
function fl(q){q=q.toLowerCase();$('#bt').innerHTML='<tr><th>No.</th><th>Date</th><th>Customer</th><th>Total</th><th></th></tr>'+bills.map((b,i)=>[b,i]).filter(([b])=>(b.no+b.to).toLowerCase().includes(q)).map(([b,i])=>`<tr><td>${esc(b.no)}</td><td>${dm(b.date)}</td><td>${esc(b.to.split('\n')[0])}</td><td>${f2(calc(b).tot)}</td><td><button onclick="act(${i},'d')">PDF</button><button onclick="act(${i},'p')">Print</button><button onclick="act(${i},'s')">Share</button><button class="r" onclick="delB(${i})">Delete</button></td></tr>`).join('')}
async function act(i,m){const b=bills[i],n=`Invoice-${b.no}.pdf`;if(m==='d')dl(await blob(inv(b),n),n);else if(m==='s')share(inv(b),n,`B. S. Venture - Invoice ${b.no}, Rs. ${f2(calc(b).tot)}`);else{$('#sheet').innerHTML=inv(b);setTimeout(()=>print(),300)}}
async function delB(i){if(!confirm('Delete invoice '+bills[i].no+'? This cannot be undone. (Take a backup first if unsure.)'))return;bills.splice(i,1);await kv('set','bills',bills);vBills()}
async function delP(i){if(!confirm('Delete this purchase bill? This cannot be undone.'))return;purch.splice(i,1);await kv('set','purch',purch);vPurch()}
function vPurch(){$('#v').innerHTML=`<div class="card"><b>Upload purchase bill photo</b><div class="row"><div>Supplier<input id="ps"></div><div>Bill date<input id="pd" type="date"></div><div>Amount (Rs.)<input id="pa" type="number"></div><div>Note<input id="pn"></div></div><br><input id="pf" type="file" accept="image/*"><br><br><button onclick="addP()">Save &amp; make PDF</button></div><div class="card"><table class="l"><tr><th>Date</th><th>Supplier</th><th>Amount</th><th></th></tr>${purch.map((p,i)=>`<tr><td>${dm(p.date)}</td><td>${esc(p.sup)}</td><td>${esc(p.amt)}</td><td><button onclick="pa(${i},'d')">PDF</button><button onclick="pa(${i},'s')">Share</button><button class="r" onclick="delP(${i})">Delete</button></td></tr>`).join('')}</table></div>`}
const pdfHtml=p=>`<div style="width:794px;padding:20px;font:14px Arial"><p><b>Purchase Bill</b> | Supplier: ${esc(p.sup)} | Date: ${dm(p.date)} | Amount: Rs. ${esc(p.amt)}<br>${esc(p.note)}</p><img src="${p.img}" style="max-width:754px;max-height:1000px"></div>`;
function addP(){const f=$('#pf').files[0];if(!f)return alert('Choose a photo');const im=new Image();im.onload=async()=>{const s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
const p={sup:$('#ps').value,date:$('#pd').value,amt:$('#pa').value,note:$('#pn').value,img:c.toDataURL('image/jpeg',.8)};purch.unshift(p);await kv('set','purch',purch);dl(await blob(pdfHtml(p),'Purchase.pdf'),'Purchase.pdf');vPurch()};im.src=URL.createObjectURL(f)}
async function pa(i,m){const p=purch[i],n=`Purchase-${p.sup||i}.pdf`;if(m==='d')dl(await blob(pdfHtml(p),n),n);else share(pdfHtml(p),n,'Purchase bill: '+p.sup)}
function vBk(){$('#v').innerHTML=`<div class="card"><b>Backup</b><p>Save a backup file to pendrive / laptop / Google Drive regularly. Browser data can be lost if the browser is cleared.</p><button onclick="exp()">Export Backup</button> <input type="file" id="bf" accept=".json" onchange="imp(this.files[0])"></div><div class="card"><b>Change password</b><input id="np" type="password" placeholder="New password (min 8 chars)"><br><br><button onclick="cp()">Change</button></div>`}
async function exp(){const d=JSON.stringify({bills,purch,seq:await kv('get','seq'),cred:await kv('get','cred')});dl(new Blob([d],{type:'application/json'}),`BSV-backup-${new Date().toISOString().slice(0,10)}.json`)}
function imp(f){const r=new FileReader();r.onload=async()=>{const d=JSON.parse(r.result);if(!confirm('Replace current data with backup?'))return;bills=d.bills||[];purch=d.purch||[];await kv('set','bills',bills);await kv('set','purch',purch);if(d.seq)await kv('set','seq',d.seq);if(d.cred)await kv('set','cred',d.cred);alert('Restored');show()};r.readAsText(f)}
async function cp(){const v=$('#np').value;if(v.length<8)return alert('Too short');await kv('set','cred',await sha(v));alert('Password changed')}
(async()=>{if(sessionStorage.ok){await load();await newDraft();show()}else loginUI()})();
</script></body></html>
